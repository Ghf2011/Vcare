<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Font Awesome Lokal (Offline) -->
  <link rel="stylesheet" href="fontawsome/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar main-sidebar">
      <div class="brand">
        <img src="Vcare.png" alt="Logo VCare" class="brand-logo-img" />
        <span><strong>VCare</strong><small>Catatan kendaraan</small></span>
      </div>
      <p class="nav-title">Menu utama</p>
      <nav class="nav-list">
        <a href="dashboard.html" class="nav-button"><i class="fa-solid fa-house"></i>Dashboard</a>
        <a href="kendaraan.html" class="nav-button active"><i class="fa-solid fa-warehouse"></i>Garasi</a>
        <a href="jadwal_servis.html" class="nav-button"><i class="fa-solid fa-calendar"></i>Jadwal Servis</a>
        <a href="riwayat.html" class="nav-button"><i class="fa-solid fa-clock-rotate-left"></i>Riwayat Servis</a>
        <a href="rekap_biaya.html" class="nav-button"><i class="fa-solid fa-file-invoice-dollar"></i>Rekap Biaya</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <span class="date-label">GARASI SAYA</span>
          <h1>Kelola Kendaraan</h1>
        </div>
        <div class="top-actions">
          <!-- Tombol Notifikasi Pintar -->
          <button class="circle-button" id="notifBtn" aria-label="Notifikasi">
            <i class="fa-solid fa-bell"></i>
            <span class="badge" id="notifBadge" style="display:none;">!</span>
          </button>
          <!-- Profil (Masuk ke Pengaturan) -->
          <a href="pengaturan.html" class="profile-button" style="text-decoration:none;">
            <div class="avatar" id="userAvatar">A</div>
            <span id="userNameTop">User</span>
          </a>
          <!-- Tombol Keluar -->
          <button class="secondary-btn" id="logoutBtn" style="padding: 6px 12px; font-size: 12px; height: 36px;">
            <i class="fa-solid fa-right-from-bracket"></i> Keluar
          </button>
        </div>
      </header>

      <!-- Toolbar Pencarian & Tombol Tambah -->
      <div class="toolbar">
        <label class="search-box">
          <i class="fa-solid fa-magnifying-glass" style="color: var(--muted);"></i>
          <input id="searchInput" placeholder="Cari kendaraan atau nomor polisi..." />
        </label>
        <button class="primary-btn" id="openAddVehicleModalBtn">
          <i class="fa-solid fa-plus"></i> Tambah kendaraan
        </button>
      </div>

      <!-- Container Kartu Kendaraan -->
      <section id="vehicleContainer" class="card-grid">
        <!-- Diisi otomatis oleh script.js -->
      </section>
    </main>
  </div>

  <!-- POP-UP MODAL TAMBAH KENDARAAN -->
  <div id="vehicleModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-head">
        <div><p class="eyebrow">VCARE</p><h2 id="modalTitle">Tambah kendaraan</h2></div>
        <button class="icon-button" id="closeVehicleModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="vehicleForm">
        <label class="field">Nama kendaraan
          <input id="vName" type="text" placeholder="Contoh: Honda Beat" required />
        </label>
        <div class="form-grid">
          <label class="field">Nomor polisi
            <input id="vPlate" type="text" placeholder="BP 1234 XY" required />
          </label>
          <label class="field">Tahun
            <input id="vYear" type="number" min="0" max="2027" placeholder="2026" required />
          </label>
        </div>
        <label class="field">Odometer (km)
          <input id="vOdometer" type="number" min="0" placeholder="15000" required />
        </label>
        <button class="primary-btn full-btn" type="submit">Simpan kendaraan</button>
      </form>
    </div>
  </div>

  <!-- POP-UP MODAL EDIT KENDARAAN -->
  <div id="vehicleEditModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-head">
        <div><p class="eyebrow">VCARE</p><h2>Edit Kendaraan</h2></div>
        <button class="icon-button" id="closeVehicleEditModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="vehicleEditForm">
        <input type="hidden" id="vEditId" />
        <label class="field">Nama kendaraan
          <input id="vEditName" type="text" placeholder="Contoh: Honda Beat" required />
        </label>
        <div class="form-grid">
          <label class="field">Nomor polisi
            <input id="vEditPlate" type="text" placeholder="BP 1234 XY" required />
          </label>
          <label class="field">Tahun
            <input id="vEditYear" type="number" min="0" max="2027" placeholder="2026" required />
          </label>
        </div>
        <label class="field">Odometer (km)
          <input id="vEditOdometer" type="number" min="0" placeholder="15000" required />
        </label>
        <button class="primary-btn full-btn" type="submit">Simpan Perubahan</button>
      </form>
    </div>
  </div>

  <!-- BAR NAVIGASI BAWAH KHUSUS HP -->
  <aside class="mobile-bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>
    <button id="mobileMenuBtn" class="nav-item" style="background:none; border:none; cursor:pointer;">
      <i class="fa-solid fa-bars"></i>
      <span>Menu</span>
    </button>
  </aside>

  <!-- POP-UP MENU LAINNYA -->
<div id="mobileMenuPopup" class="mobile-menu-popup" style="display: none;">
  <div class="popup-content">
    <div class="popup-handle"></div>
    <div class="popup-header">
      <h3>Menu Navigasi</h3>
      <button id="closePopupBtn" class="popup-close-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="popup-list">
      <li><a href="kendaraan.html" class="popup-link"><i class="fa-solid fa-car"></i> Garasi</a></li>
      <li><a href="jadwal_servis.html" class="popup-link"><i class="fa-solid fa-calendar-days"></i> Jadwal Servis</a></li>
      <li><a href="riwayat.html" class="popup-link"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Servis</a></li>
      <li><a href="rekap_biaya.html" class="popup-link"><i class="fa-solid fa-wallet"></i> Rekap Biaya</a></li>
  </div>
</div>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
