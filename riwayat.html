<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Servis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="fontawsome/css/all.min.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar main-sidebar">
      <div class="brand">
        <img src="Vcare.png" alt="Logo VCare" class="brand-logo-img" />
        <span><strong>VCare</strong><small>Catatan kendaraan</small></span>
      </div>
      <p class="nav-title">Menu utama</p>
     <nav class="nav-list">
         <a href="dashboard.html" class="nav-button "><i class="fa-solid fa-house"></i>Dashboard</a>
         <a href="kendaraan.html" class="nav-button"><i class="fa-solid fa-warehouse"></i></i>Garasi</a>
         <a href="jadwal_servis.html" class="nav-button"><i class="fa-solid fa-calendar"></i>Jadwal Servis</a>
         <a href="riwayat.html" class="nav-button active"><i class="fa-solid fa-clock-rotate-left"></i>Riwayat Servis</a>
         <a href="rekap_biaya.html" class="nav-button"><i class="fa-solid fa-file-invoice-dollar"></i>Rekap Biaya</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <span class="date-label">Lihat data servis kamu</span>
          <h1 id="welcomeName">Riwayat Servis</h1>
        </div>
        <div class="top-actions">
        <!-- Tombol Notifikasi Pintar -->
            <button class="circle-button" id="notifBtn" aria-label="Notifikasi">
            <i class="fa-solid fa-bell"></i>
            <span class="badge" id="notifBadge" style="display:none;">!</span>
            </button>
<!-- Profil Kanan Atas (Tautkan ke Pengaturan) -->
            <a href="pengaturan.html" class="profile-button" style="text-decoration:none;">
                  <div class="avatar" id="userAvatar">A</div>
                <span id="userNameTop">User</span>
            </a>
        <!-- Tombol Keluar di Atas Kanan -->
            <button class="secondary-btn" id="logoutBtn" style="padding: 6px 12px; font-size: 12px; height: 36px;">
            <i class="fa-solid fa-right-from-bracket"></i>Keluar</button>
        </div>
      </header>
    <!-- Pencarian -->
    <div style="margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <label class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="historySearchInput" type="text" placeholder="Cari kendaraan, bengkel, catatan..." style="flex: 1; min-width: 220px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border, #cbd5e1); background: var(--card-bg, #fff); color: inherit;" />
      </label>
      
  <select id="historyFilterType" style="padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border, #cbd5e1); background: var(--card-bg, #fff); color: inherit;">
    <option value="">Semua Jenis Servis</option>
  </select>

  <!-- FILTER PERIODE TANGGAL (FR-04) -->
  <div style="display: flex; gap: 8px; align-items: center;">
    <input type="date" id="historyStartDate" style="padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border, #cbd5e1); background: var(--card-bg, #fff); color: inherit;" />
    <span class="muted">s.d.</span>
    <input type="date" id="historyEndDate" style="padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border, #cbd5e1); background: var(--card-bg, #fff); color: inherit;" />
  </div>
</div>
      </header>

      <div class="panel no-pad table-wrap">
        <table>
          <thead>
            <tr>
              <th>Kendaraan</th>
              <th>Perawatan</th>
              <th>Tanggal/KM</th>
              <th>Bengkel</th>
              <th>Biaya</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <!-- Diisi oleh script.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- BAR NAVIGASI BAWAH KHUSUS HP -->
  <aside class="mobile-bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>
    <button id="mobileMenuBtn" class="nav-item" style="background:none; border:none; cursor:pointer;">
      <i class="fa-solid fa-bars"></i>
      <span>Menu</span>
    </button>
  </aside>

  <!-- POP-UP MENU LAINNYA -->
<div id="mobileMenuPopup" class="mobile-menu-popup" style="display: none;">
  <div class="popup-content">
    <div class="popup-handle"></div>
    <div class="popup-header">
      <h3>Menu Navigasi</h3>
      <button id="closePopupBtn" class="popup-close-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="popup-list">
      <li><a href="kendaraan.html" class="popup-link"><i class="fa-solid fa-car"></i> Garasi</a></li>
      <li><a href="jadwal_servis.html" class="popup-link"><i class="fa-solid fa-calendar-days"></i> Jadwal Servis</a></li>
      <li><a href="riwayat.html" class="popup-link"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Servis</a></li>
      <li><a href="rekap_biaya.html" class="popup-link"><i class="fa-solid fa-wallet"></i> Rekap Biaya</a></li>
    </ul>
  </div>
</div>




















































































































































  <script src="script.js"></script>
</body>
</html>
